<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <script src="./javascript.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="nav">
            <div class="logo">
                <h1>My Library</h1>
            </div>
            <button type="button" id="addButton"> + Add Book</button>
        </div>
        <div class="contents">
            <div class="top">
                <button type="button">All</button>
                <button type="button">Read</button>
                <button type="button">Wishlist</button>
                <button type="button">Favourites</button>

            </div>
            <div class="bottom">
                <div class="book-card" id="1">
                    <img class="book-card__cover"
                        src="./assets/plane book cover.jpg"
                        alt="The Alchemist book cover">
                    <div class="book-card__body">
                        <p class="book-card__author">Paulo Coelho</p>
                        <p class="book-card__title">The Alchemist</p>
                        <div class="book-card__footer">
                            <div class="book-card__tags">
                                <div class="tag tag--fiction">Fiction</div>
                                <div class="tag tag--read">Read</div>
                            </div>
                            <button class="book-card__delete" aria-label="Delete">
                                <img src="./assets/dustbin image.png" alt="del" class="delButton">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body> 

</html>
